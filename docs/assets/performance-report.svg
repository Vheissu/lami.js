<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1406" viewBox="0 0 1160 1406" role="img" aria-labelledby="title desc">
  <title id="title">Lami.js performance comparison</title>
  <desc id="desc">Median and p95 timings for Lami.js, vanilla DOM, React 19, and Svelte 5 scenarios.</desc>
  <style>
    .bg { fill: #fbfaf5; }
    .title { fill: #211f1a; font: 700 36px Georgia, serif; }
    .meta, .description { fill: #6c665b; font: 14px ui-sans-serif, system-ui, sans-serif; }
    .scenario { fill: #211f1a; font: 700 21px ui-sans-serif, system-ui, sans-serif; }
    .engine { fill: #211f1a; font: 600 16px ui-sans-serif, system-ui, sans-serif; }
    .value { fill: #211f1a; font: 600 14px ui-sans-serif, system-ui, sans-serif; }
    .axis { stroke: #d8d1c3; stroke-width: 1; }
    .grid { stroke: #ded7c9; stroke-width: 1; stroke-dasharray: 3 5; }
    .tick { fill: #6c665b; font: 12px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
    .p95 { opacity: 0.35; }
    .median { opacity: 1; }
    .lami { fill: #2f6f63; }
    .compiled { fill: #5f7741; }
    .vanilla { fill: #b68a2d; }
    .react { fill: #784f3f; }
    .svelte { fill: #b64b34; }
    .note { fill: #4b473f; font: 600 15px ui-sans-serif, system-ui, sans-serif; }
  </style>
  <rect class="bg" width="100%" height="100%" />
  <text x="48" y="58" class="title">Lami.js Performance Comparison</text>
  <text x="48" y="88" class="meta">Generated 2026-05-11T22:17:39.835Z on v25.2.1 with React 19.2.5, Svelte 5.55.5, and jsdom 26.1.0</text>
  <line x1="300" x2="920" y1="112" y2="112" class="axis" />

  <line x1="300.0" x2="300.0" y1="118" y2="1336" class="grid" />
  <text x="300.0" y="1356" class="tick">0.0 ms</text>
  <line x1="493.8" x2="493.8" y1="118" y2="1336" class="grid" />
  <text x="493.8" y="1356" class="tick">50.0 ms</text>
  <line x1="687.5" x2="687.5" y1="118" y2="1336" class="grid" />
  <text x="687.5" y="1356" class="tick">100 ms</text>
  <line x1="881.3" x2="881.3" y1="118" y2="1336" class="grid" />
  <text x="881.3" y="1356" class="tick">150 ms</text>
  <text x="300" y="103" class="meta">shorter is faster; solid bar = median, pale bar = p95</text>

  <text x="48" y="132" class="scenario">Render 750 rows</text>
  <text x="48" y="156" class="description">Initial render of 750 keyed rows with checkbox state and text output.</text>

  <text x="72" y="191" class="engine">Lami.js</text>
  <rect x="300" y="174" width="575.5" height="20" rx="4" class="p95 lami" />
  <rect x="300" y="179" width="436.9" height="10" rx="3" class="median lami" />
  <text x="889.528078125" y="189" class="value">112.7 ms median / 148.5 ms p95</text>
  <text x="72" y="225" class="engine">Lami compiled</text>
  <rect x="300" y="208" width="177.2" height="20" rx="4" class="p95 compiled" />
  <rect x="300" y="213" width="161.0" height="10" rx="3" class="median compiled" />
  <text x="491.2284531249998" y="223" class="value">41.55 ms median / 45.74 ms p95</text>
  <text x="72" y="259" class="engine">Vanilla DOM</text>
  <rect x="300" y="242" width="115.7" height="20" rx="4" class="p95 vanilla" />
  <rect x="300" y="247" width="107.4" height="10" rx="3" class="median vanilla" />
  <text x="429.74092187500025" y="257" class="value">27.70 ms median / 29.87 ms p95</text>
  <text x="72" y="293" class="engine">React 19</text>
  <rect x="300" y="276" width="136.5" height="20" rx="4" class="p95 react" />
  <rect x="300" y="281" width="111.3" height="10" rx="3" class="median react" />
  <text x="450.45247524999985" y="291" class="value">28.73 ms median / 35.21 ms p95</text>
  <text x="72" y="327" class="engine">Svelte 5</text>
  <rect x="300" y="310" width="166.4" height="20" rx="4" class="p95 svelte" />
  <rect x="300" y="315" width="156.5" height="10" rx="3" class="median svelte" />
  <text x="480.39137237500086" y="325" class="value">40.39 ms median / 42.94 ms p95</text>
  <text x="48" y="342" class="scenario">Update to 501 rows</text>
  <text x="48" y="366" class="description">Prepend one row, retain 300 existing rows, and append 200 new rows.</text>

  <text x="72" y="401" class="engine">Lami.js</text>
  <rect x="300" y="384" width="602.3" height="20" rx="4" class="p95 lami" />
  <rect x="300" y="389" width="488.4" height="10" rx="3" class="median lami" />
  <text x="916.3083620000002" y="399" class="value">126.0 ms median / 155.4 ms p95</text>
  <text x="72" y="435" class="engine">Lami compiled</text>
  <rect x="300" y="418" width="258.7" height="20" rx="4" class="p95 compiled" />
  <rect x="300" y="423" width="242.1" height="10" rx="3" class="median compiled" />
  <text x="572.7382682499999" y="433" class="value">62.48 ms median / 66.77 ms p95</text>
  <text x="72" y="469" class="engine">Vanilla DOM</text>
  <rect x="300" y="452" width="184.6" height="20" rx="4" class="p95 vanilla" />
  <rect x="300" y="457" width="159.1" height="10" rx="3" class="median vanilla" />
  <text x="498.620821624997" y="467" class="value">41.07 ms median / 47.64 ms p95</text>
  <text x="72" y="503" class="engine">React 19</text>
  <rect x="300" y="486" width="526.8" height="20" rx="4" class="p95 react" />
  <rect x="300" y="491" width="175.8" height="10" rx="3" class="median react" />
  <text x="840.8485495" y="501" class="value">45.37 ms median / 136.0 ms p95</text>
  <text x="72" y="537" class="engine">Svelte 5</text>
  <rect x="300" y="520" width="246.9" height="20" rx="4" class="p95 svelte" />
  <rect x="300" y="525" width="233.7" height="10" rx="3" class="median svelte" />
  <text x="560.8633307500002" y="535" class="value">60.30 ms median / 63.71 ms p95</text>
  <text x="48" y="552" class="scenario">Dispose 250 listeners</text>
  <text x="48" y="576" class="description">Create 250 clickable rows, dispose them, then verify old listeners no longer fire.</text>

  <text x="72" y="611" class="engine">Lami.js</text>
  <rect x="300" y="594" width="64.1" height="20" rx="4" class="p95 lami" />
  <rect x="300" y="599" width="57.1" height="10" rx="3" class="median lami" />
  <text x="378.08507162500143" y="609" class="value">14.75 ms median / 16.54 ms p95</text>
  <text x="72" y="645" class="engine">Lami compiled</text>
  <rect x="300" y="628" width="42.3" height="20" rx="4" class="p95 compiled" />
  <rect x="300" y="633" width="22.0" height="10" rx="3" class="median compiled" />
  <text x="356.3130624999999" y="643" class="value">5.67 ms median / 10.92 ms p95</text>
  <text x="72" y="679" class="engine">Vanilla DOM</text>
  <rect x="300" y="662" width="23.4" height="20" rx="4" class="p95 vanilla" />
  <rect x="300" y="667" width="10.1" height="10" rx="3" class="median vanilla" />
  <text x="337.3612434999993" y="677" class="value">2.61 ms median / 6.03 ms p95</text>
  <text x="72" y="713" class="engine">React 19</text>
  <rect x="300" y="696" width="15.2" height="20" rx="4" class="p95 react" />
  <rect x="300" y="701" width="12.5" height="10" rx="3" class="median react" />
  <text x="329.21195962500167" y="711" class="value">3.24 ms median / 3.93 ms p95</text>
  <text x="72" y="747" class="engine">Svelte 5</text>
  <rect x="300" y="730" width="20.8" height="20" rx="4" class="p95 svelte" />
  <rect x="300" y="735" width="18.7" height="10" rx="3" class="median svelte" />
  <text x="334.7553060000006" y="745" class="value">4.83 ms median / 5.36 ms p95</text>

  <text x="48" y="780" class="scenario">Lami island churn</text>
  <text x="48" y="804" class="description">Mutation-observed enhancement and cleanup for 40 scoped islands.</text>

  <text x="72" y="848" class="engine">Lami.js</text>
  <rect x="300" y="831" width="29.9" height="20" rx="4" class="p95 lami" />
  <rect x="300" y="836" width="17.6" height="10" rx="3" class="median lami" />
  <text x="343.86010287499994" y="846" class="value">4.54 ms median / 7.71 ms p95</text>
  <text x="48" y="892" class="scenario">Compiled show row refresh</text>
  <text x="48" y="916" class="description">Toggle 600 compiled repeat-row show bindings without leaving the optimized row path.</text>

  <text x="72" y="960" class="engine">Lami compiled</text>
  <rect x="300" y="943" width="101.8" height="20" rx="4" class="p95 compiled" />
  <rect x="300" y="948" width="84.2" height="10" rx="3" class="median compiled" />
  <text x="415.7721940000025" y="958" class="value">21.72 ms median / 26.26 ms p95</text>
  <text x="48" y="1004" class="scenario">Component slot mount</text>
  <text x="48" y="1028" class="description">Render 120 lightweight elements with bindable props, named slots, and projected parent-scope content.</text>

  <text x="72" y="1072" class="engine">Lami.js</text>
  <rect x="300" y="1055" width="119.8" height="20" rx="4" class="p95 lami" />
  <rect x="300" y="1060" width="116.3" height="10" rx="3" class="median lami" />
  <text x="433.79045575000146" y="1070" class="value">30.02 ms median / 30.91 ms p95</text>
  <text x="72" y="1106" class="engine">Lami compiled</text>
  <rect x="300" y="1089" width="82.9" height="20" rx="4" class="p95 compiled" />
  <rect x="300" y="1094" width="72.0" height="10" rx="3" class="median compiled" />
  <text x="396.93549349999853" y="1104" class="value">18.57 ms median / 21.40 ms p95</text>
  <text x="48" y="1150" class="scenario">Rich component slot mount</text>
  <text x="48" y="1174" class="description">Render 120 lightweight elements whose internal template uses text, class, property, style, show, attribute interpolation, events, and slots.</text>

  <text x="72" y="1218" class="engine">Lami.js</text>
  <rect x="300" y="1201" width="167.0" height="20" rx="4" class="p95 lami" />
  <rect x="300" y="1206" width="164.0" height="10" rx="3" class="median lami" />
  <text x="480.99280337500136" y="1216" class="value">42.33 ms median / 43.09 ms p95</text>
  <text x="72" y="1252" class="engine">Lami compiled</text>
  <rect x="300" y="1235" width="124.3" height="20" rx="4" class="p95 compiled" />
  <rect x="300" y="1240" width="115.3" height="10" rx="3" class="median compiled" />
  <text x="438.33454037500076" y="1250" class="value">29.76 ms median / 32.09 ms p95</text>
  <text x="48" y="1374" class="note">Local smoke benchmark; exact numbers vary by hardware and runtime.</text>
</svg>
